[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "mandate-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi==0.162.0", "uvicorn==0.54.0", "sqlalchemy==2.1.6", "psycopg[binary]==3.3.6", "httpx==0.28.1", "python-dotenv==1.2.4", "alembic==1.20.1"]

[project.optional-dependencies]
test = ["pytest==9.2.0", "pytest-asyncio==1.4.1"]

[tool.setuptools]
packages = ["mandate", "mandate.agents", "mandate.payments", "mandate_migrations", "mandate_migrations.versions"]
package-dir = { mandate_migrations = "alembic" }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
