services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: mandate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: mandate
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - mandate-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mandate -d mandate"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  mandate-postgres:
