name: Application checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm@sha256:839fbb5a4942a7758dd93e18b42ea5649807491a0545b5eeeb8f0b8bb11857a5
        env:
          POSTGRES_USER: mandate
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: mandate
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mandate -d mandate"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://mandate:ci_only_password@localhost:5432/mandate
      COOKIE_SECURE: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements*.lock.txt
      - run: python -m pip install -r requirements-dev.lock.txt -e './apps/api[test]'
      - run: python -m pip check
      - run: python -m compileall -q apps/api/mandate apps/api/alembic
      - run: python -m mandate.migrate
      - run: python -m pytest apps/api/tests -q
      - run: python -m pip wheel --no-deps --wheel-dir /tmp/mandate-wheels ./apps/api
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: docker build --tag mandate:ci .
      - run: docker run --rm --entrypoint python mandate:ci -c "import os; from importlib.resources import files; assert os.getuid() != 0; assert files('mandate_migrations').joinpath('versions/0002_hardening.py').is_file(); assert os.path.isfile('/app/apps/web/dist/index.html')"
